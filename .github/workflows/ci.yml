name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            working-dir: services/user-service
            requirements: services/user-service/requirements.txt
            pytest-args: ''
          - service: photo-service
            working-dir: services/photo-service
            requirements: services/photo-service/requirements.txt
            pytest-args: ''
          - service: character-service
            working-dir: services/character-service/app
            requirements: services/character-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: skills-service
            working-dir: services/skills-service/app
            requirements: services/skills-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: inventory-service
            working-dir: services/inventory-service/app
            requirements: services/inventory-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: character-attributes-service
            working-dir: services/character-attributes-service/app
            requirements: services/character-attributes-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: locations-service
            working-dir: services/locations-service/app
            requirements: services/locations-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: notification-service
            working-dir: services/notification-service/app
            requirements: services/notification-service/app/requirements.txt
            pytest-args: ''
          - service: battle-service
            working-dir: services/battle-service/app
            requirements: services/battle-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: autobattle-service
            working-dir: services/autobattle-service/app
            requirements: services/autobattle-service/app/requirements.txt
            pytest-args: ''
          - service: battle-pass-service
            working-dir: services/battle-pass-service/app
            requirements: services/battle-pass-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto'
          - service: dungeon-service
            working-dir: services/dungeon-service/app
            requirements: services/dungeon-service/app/requirements.txt
            pytest-args: '--asyncio-mode=auto --timeout=30 --timeout-method=signal'
          - service: party-service
            working-dir: services/party-service/app
            requirements: services/party-service/app/requirements.txt
            pytest-args: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libmariadb-dev-compat libmariadb-dev pkg-config libgomp1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install Python dependencies
        run: pip install -r ${{ matrix.requirements }}

      - name: Run tests
        timeout-minutes: 6
        run: cd ${{ matrix.working-dir }} && python -m pytest tests/ ${{ matrix.pytest-args }} -v

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Short sessions with keepalives: the deploy itself runs detached on the
      # server (docker/deploy-prod.sh), SSH is only used to start and poll it
      SSH_OPTS: -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i key

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > key
          chmod 600 key

      - name: Start deploy on the server
        run: |
          # The script is taken from the pushed commit, not from the server's
          # checkout, so changes to the deploy itself apply on the same push
          ssh $SSH_OPTS "$TARGET" "RUN_ID=$RUN_ID bash -s" << 'EOF'
            set -e
            cd ~/rpgroll
            git fetch origin main
            mkdir -p ~/deploy
            git show origin/main:docker/deploy-prod.sh > ~/deploy/deploy-prod.sh
            nohup bash ~/deploy/deploy-prod.sh "$RUN_ID" > ~/deploy/"$RUN_ID".log 2>&1 < /dev/null &
            echo "deploy $RUN_ID started"
          EOF

      - name: Wait for deploy to finish
        timeout-minutes: 60
        run: |
          POLL_SECONDS=30
          while true; do
            sleep $POLL_SECONDS
            # A dropped or refused connection is not a failed deploy: keep polling
            if ! STATE=$(ssh $SSH_OPTS "$TARGET" \
                "cat ~/deploy/$RUN_ID.exit 2>/dev/null || echo running; grep '^===' ~/deploy/$RUN_ID.log | tail -n 1"); then
              echo "server did not answer, retrying"
              continue
            fi
            echo "$STATE" | tail -n 1
            CODE=$(echo "$STATE" | head -n 1)
            if [ "$CODE" != "running" ]; then
              ssh $SSH_OPTS "$TARGET" "tail -n 60 ~/deploy/$RUN_ID.log" || true
              echo "deploy finished with exit code $CODE"
              exit "$CODE"
            fi
          done
