worker_processes 1;

events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 500;

    client_max_body_size 16m;

    # FEAT-123 T8: rate limit for POST /characters/npcs/{id}/teleport
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr). Target: ~10 req/min per client.
    limit_req_zone $binary_remote_addr zone=teleport_limit:10m rate=10r/m;

    # FEAT-128 T18: rate limit for POST /locations/{lid}/gathering-nodes/{nid}/start|cancel
    # Per-IP fallback (stock Nginx). Target: ~10 req/min per client, burst=5.
    limit_req_zone $binary_remote_addr zone=gathering_limit:10m rate=10r/m;

    # FEAT-154 T12: rate limit for the character-creation wizard.
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr).
    # Shared by POST /characters/requests/ and PUT /characters/requests/{id}:
    # a player either submits or edits a request, never both at once, so one
    # 10 req/min budget covers §3.3's "10 r/m" for each of the two routes.
    limit_req_zone $binary_remote_addr zone=charreq_limit:10m rate=10r/m;

    # FEAT-154 T12: rate limit for POST /photo/upload_character_request_avatar.
    # Target: ~12 req/min per client (§3.3).
    limit_req_zone $binary_remote_addr zone=avatar_upload_limit:10m rate=12r/m;

    upstream user-service_backend {
        server user-service:8000;
    }
    upstream character-attributes-service_backend{
        server character-attributes-service:8002;
    }

    upstream skills-service_backend{
        server skills-service:8003;
    }

    upstream inventory-service_backend{
        server inventory-service:8004;
    }
    upstream character-service_backend{
        server character-service:8005;
    }
    upstream locations-service_backend{
        server locations-service:8006;
    }

    upstream photo-service_backend{
        server photo-service:8001;
    }

    upstream notification-service_backend{
        server notification-service:8007;
    }

    upstream battle-service_backend {
        server battle-service:8010;
    }

    upstream autobattle-service_backend {
        server autobattle-service:8011;
    }

    upstream battle-pass-service_backend {
        server battle-pass-service:8012;
    }

    upstream dungeon-service_backend {
        server dungeon-service:8013;
    }

    upstream party-service_backend {
        server party-service:8014;
    }

    # HTTP — ACME challenge + redirect to HTTPS
    server {
        listen 80;
        server_name fallofgods.top;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — main server
    server {
        listen 443 ssl;
        server_name fallofgods.top;

        ssl_certificate     /etc/letsencrypt/live/fallofgods.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fallofgods.top/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # API proxy locations
        location /api/ {
            proxy_pass http://user-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal user-service endpoints from external access
        location /users/internal/ {
            return 403;
        }

        location /users/ {
            proxy_pass http://user-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal service-to-service endpoints from external access
        location /characters/internal/ {
            return 403;
        }

        location ~ ^/characters/\d+/add_rewards$ {
            return 403;
        }

        # FEAT-123 T8: rate limit teleport POSTs (10 req/min per IP).
        # Endpoint only accepts POST; non-POST methods 405 from backend.
        location ~ ^/characters/npcs/\d+/teleport$ {
            limit_req zone=teleport_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit character-request submit (10 req/min per IP).
        # Regex locations are evaluated in declaration order and take precedence
        # over the non-exact /characters/ prefix, so both blocks must stay above
        # it. The pattern matches only the exact collection path — POST is the
        # sole method there; /characters/requests/claim and /characters/requests/my
        # are NOT matched.
        location ~ ^/characters/requests/?$ {
            limit_req zone=charreq_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit character-request edit (10 req/min per IP).
        # PUT /characters/requests/{id} is the only method on this exact path;
        # .../approve and .../reject carry an extra segment and are NOT matched.
        location ~ ^/characters/requests/[0-9]+$ {
            limit_req zone=charreq_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /characters/ {
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /attributes/ {
            proxy_pass http://character-attributes-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /skills/ {
            proxy_pass http://skills-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal inventory endpoints from external access
        location /inventory/internal/ {
            return 403;
        }

        location /inventory/ {
            proxy_pass http://inventory-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit the character-creation avatar upload
        # (12 req/min per IP, 16m body cap — §3.3). Exact-match location wins
        # over every prefix and regex block, so it must repeat the body cap that
        # the /photo/ prefix block sets: directives are not inherited between
        # sibling locations.
        location = /photo/upload_character_request_avatar {
            client_max_body_size 16m;
            limit_req zone=avatar_upload_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://photo-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /photo/ {
            client_max_body_size 16m;
            proxy_pass http://photo-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-128 T18: rate limit gathering start/cancel POSTs (10 req/min per IP).
        # Regex location must be declared before the prefix /locations/ block — nginx
        # evaluates regex blocks in declaration order and they take precedence over
        # non-exact prefix matches. Pattern strictly targets numeric ids and the two
        # action verbs, so admin/client/details/internal routes are NOT matched.
        location ~ ^/locations/[0-9]+/gathering-nodes/[0-9]+/(start|cancel)$ {
            limit_req zone=gathering_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /locations/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rules/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /archive/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notifications/ {
            proxy_pass http://notification-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600;
        }

        location /battles/internal/ {
            return 403;
        }

        location /battles/ {
            proxy_pass http://battle-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # Block internal autobattle endpoints from external access
        location /autobattle/internal/ {
            return 403;
        }

        location /autobattle/ {
            rewrite ^/autobattle(/.*)$ $1 break;
            proxy_pass http://autobattle-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal battle-pass endpoints from external access
        location /battle-pass/internal/ {
            return 403;
        }

        location /battle-pass/ {
            proxy_pass http://battle-pass-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal dungeon-service endpoints from external access
        location /dungeons/internal/ {
            return 403;
        }

        location /dungeons/ {
            proxy_pass http://dungeon-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # Block internal party-service endpoints from external access
        location /party/internal/ {
            return 403;
        }

        location /party/ {
            proxy_pass http://party-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /var/www/photo-service/media/;
            try_files $uri $uri/ =404;
            autoindex off;
        }

        # Dev tools — Adminer (MySQL GUI)
        location /adminer/ {
            proxy_pass http://adminer:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static frontend (SPA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
