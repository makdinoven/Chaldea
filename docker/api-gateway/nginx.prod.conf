worker_processes 1;

events {
    worker_connections 1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 500;

    client_max_body_size 16m;

    # FEAT-123 T8: rate limit for POST /characters/npcs/{id}/teleport
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr). Target: ~10 req/min per client.
    limit_req_zone $binary_remote_addr zone=teleport_limit:10m rate=10r/m;

    # FEAT-128 T18: rate limit for POST /locations/{lid}/gathering-nodes/{nid}/start|cancel
    # Per-IP fallback (stock Nginx). Target: ~10 req/min per client, burst=5.
    limit_req_zone $binary_remote_addr zone=gathering_limit:10m rate=10r/m;

    # FEAT-154 T12: rate limit for the character-creation wizard.
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr).
    # Shared by POST /characters/requests/ and PUT /characters/requests/{id}:
    # a player either submits or edits a request, never both at once, so one
    # 10 req/min budget covers §3.3's "10 r/m" for each of the two routes.
    limit_req_zone $binary_remote_addr zone=charreq_limit:10m rate=10r/m;

    # FEAT-154 T12: rate limit for POST /photo/upload_character_request_avatar.
    # Target: ~12 req/min per client (§3.3).
    limit_req_zone $binary_remote_addr zone=avatar_upload_limit:10m rate=12r/m;

    # FEAT-156 T8: rate limit for the RP post draft autosave (PUT /locations/{lid}/draft).
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr). The client debounces autosave to ~4 req/min
    # per writer, so 60 r/m with burst=20 is a DoS guard against a looping client,
    # not a usage cap, and leaves headroom for several players behind one NAT.
    limit_req_zone $binary_remote_addr zone=draft_limit:10m rate=60r/m;

    # FEAT-159 T6: rate limit for RP post editing (PUT /locations/posts/{post_id}).
    # Per-user (JWT sub) limiting is not available in stock Nginx — falling back
    # to per-IP ($binary_remote_addr). Editing is a deliberate manual action (a
    # player fixes a typo a handful of times within the one-hour window), so
    # 20 r/m with burst=10 is an abuse guard against a scripted client hammering
    # a write that takes a FOR UPDATE lock on posts, not a usage cap — it still
    # leaves headroom for several players behind one NAT.
    limit_req_zone $binary_remote_addr zone=post_edit_limit:10m rate=20r/m;

    upstream user-service_backend {
        server user-service:8000;
    }
    upstream character-attributes-service_backend{
        server character-attributes-service:8002;
    }

    upstream skills-service_backend{
        server skills-service:8003;
    }

    upstream inventory-service_backend{
        server inventory-service:8004;
    }
    upstream character-service_backend{
        server character-service:8005;
    }
    upstream locations-service_backend{
        server locations-service:8006;
    }

    upstream photo-service_backend{
        server photo-service:8001;
    }

    upstream notification-service_backend{
        server notification-service:8007;
    }

    upstream battle-service_backend {
        server battle-service:8010;
    }

    upstream autobattle-service_backend {
        server autobattle-service:8011;
    }

    upstream battle-pass-service_backend {
        server battle-pass-service:8012;
    }

    upstream dungeon-service_backend {
        server dungeon-service:8013;
    }

    upstream party-service_backend {
        server party-service:8014;
    }

    # HTTP — ACME challenge + redirect to HTTPS
    server {
        listen 80;
        server_name fallofgods.top;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — main server
    server {
        listen 443 ssl;
        server_name fallofgods.top;

        ssl_certificate     /etc/letsencrypt/live/fallofgods.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fallofgods.top/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # API proxy locations
        location /api/ {
            proxy_pass http://user-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal user-service endpoints from external access
        location /users/internal/ {
            return 403;
        }

        location /users/ {
            proxy_pass http://user-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal service-to-service endpoints from external access
        location /characters/internal/ {
            return 403;
        }

        location ~ ^/characters/\d+/add_rewards$ {
            return 403;
        }

        # FEAT-123 T8: rate limit teleport POSTs (10 req/min per IP).
        # Endpoint only accepts POST; non-POST methods 405 from backend.
        location ~ ^/characters/npcs/\d+/teleport$ {
            limit_req zone=teleport_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit character-request submit (10 req/min per IP).
        # Regex locations are evaluated in declaration order and take precedence
        # over the non-exact /characters/ prefix, so both blocks must stay above
        # it. The pattern matches only the exact collection path — POST is the
        # sole method there; /characters/requests/claim and /characters/requests/my
        # are NOT matched.
        location ~ ^/characters/requests/?$ {
            limit_req zone=charreq_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit character-request edit (10 req/min per IP).
        # PUT /characters/requests/{id} is the only method on this exact path;
        # .../approve and .../reject carry an extra segment and are NOT matched.
        location ~ ^/characters/requests/[0-9]+$ {
            limit_req zone=charreq_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /characters/ {
            proxy_pass http://character-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-167 T10: second layer for the six mutating character-attributes
        # endpoints. They are service-to-service only (no frontend caller) and are
        # gated in the service by X-Internal-Token; nginx blocks them outright.
        # Regex locations take precedence over every non-exact prefix location, so
        # this wins over the /attributes/ block below regardless of declaration
        # order. The pattern requires a numeric character id and one of the six
        # exact suffixes, so it never touches /attributes/internal/,
        # /attributes/admin/... nor /attributes/{id}/upgrade.
        # `limit_except GET HEAD` blocks only the mutating methods: no GET is ever
        # blocked (GET /attributes/{id} and /attributes/{id}/rest-status run the
        # FEAT-164 regen catch-up and are read live by battle-service on every
        # attack, and GET /attributes/{id}/passive_experience shares a suffix with
        # the gated PUT), so reads keep proxying normally.
        location ~ ^/attributes/[0-9]+/(apply_modifiers|recover|consume_stamina|refund_stamina|active_experience|passive_experience)$ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://character-attributes-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-167 #17: second layer for POST /attributes/cumulative_stats/increment.
        # Service-to-service only (battle, locations, inventory, skills); it pumps
        # pve_kills / pvp_wins / damage totals AND unlocks perks, so an anonymous
        # POST was free progression. Exact-match location wins over every prefix
        # and regex block. `limit_except GET HEAD` keeps the shape of the FEAT-167
        # block below: no GET exists on this path today, but a future read stays
        # reachable and no mutating method gets through.
        location = /attributes/cumulative_stats/increment {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://character-attributes-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-167 #17: second layer for POST /attributes/ (create attributes row).
        # Called only by character-service (character creation, admin NPC, mob
        # spawn) container-to-container, never through the gateway. Exact match —
        # /attributes/{id} and every other sub-path are untouched.
        location = /attributes/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://character-attributes-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal character-attributes endpoints from external access
        location /attributes/internal/ {
            return 403;
        }

        location /attributes/ {
            proxy_pass http://character-attributes-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal skills-service endpoints from external access
        # (FEAT-169: /skills/internal/assign_multiple)
        location /skills/internal/ {
            return 403;
        }

        # FEAT-169: second layer for the legacy POST /skills/ ("Basic Attack"),
        # called only by character-service container-to-container. Exact match,
        # so every /skills/... sub-path (GET lists, admin routes, assign_multiple)
        # is untouched.
        location = /skills/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://skills-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /skills/ {
            proxy_pass http://skills-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-167 #18: second layer for POST /inventory/ (create inventory +
        # default equipment slots). Called only by character-service during
        # character creation, container-to-container. Exact match — every
        # /inventory/... sub-path (items, equip, trade, auction, crafting) is
        # untouched.
        location = /inventory/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://inventory-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal inventory endpoints from external access
        location /inventory/internal/ {
            return 403;
        }

        location /inventory/ {
            proxy_pass http://inventory-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-154 T12: rate limit the character-creation avatar upload
        # (12 req/min per IP, 16m body cap — §3.3). Exact-match location wins
        # over every prefix and regex block, so it must repeat the body cap that
        # the /photo/ prefix block sets: directives are not inherited between
        # sibling locations.
        location = /photo/upload_character_request_avatar {
            client_max_body_size 16m;
            limit_req zone=avatar_upload_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://photo-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /photo/ {
            client_max_body_size 16m;
            proxy_pass http://photo-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-128 T18: rate limit gathering start/cancel POSTs (10 req/min per IP).
        # Regex location must be declared before the prefix /locations/ block — nginx
        # evaluates regex blocks in declaration order and they take precedence over
        # non-exact prefix matches. Pattern strictly targets numeric ids and the two
        # action verbs, so admin/client/details/internal routes are NOT matched.
        location ~ ^/locations/[0-9]+/gathering-nodes/[0-9]+/(start|cancel)$ {
            limit_req zone=gathering_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-156 T8: rate limit RP post draft autosave (60 req/min per IP, burst 20).
        # Regex location must be declared before the prefix /locations/ block — nginx
        # evaluates regex blocks in declaration order and they take precedence over
        # non-exact prefix matches. Pattern strictly targets a numeric location id
        # followed by /draft, so /locations/drafts, /locations/admin/... and every
        # other /locations/ route are NOT matched.
        location ~ ^/locations/[0-9]+/draft$ {
            limit_req zone=draft_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FEAT-159 T6: rate limit RP post editing (20 req/min per IP, burst 10).
        # Regex location must be declared before the prefix /locations/ block — nginx
        # evaluates regex blocks in declaration order and they take precedence over
        # non-exact prefix matches. Pattern strictly targets a numeric post id with
        # nothing after it, so /locations/posts/{id}/like, /unlike, /request-deletion,
        # /report and the literal /locations/posts/as-npc, /latest, /character-stats
        # routes are NOT matched.
        location ~ ^/locations/posts/[0-9]+$ {
            limit_req zone=post_edit_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal locations-service endpoints from external access.
        # Two prefixes: /locations/internal/ (gathering-status, action-gate,
        # cancel-gathering, character-left-location) and /locations/quests/internal/
        # (quest completion checks for the perk evaluator). Prefix locations are
        # matched longest-first, so both win over the general /locations/ block
        # below; the regex blocks above target numeric ids only and never match
        # these paths.
        location /locations/internal/ {
            return 403;
        }

        location /locations/quests/internal/ {
            return 403;
        }

        location /locations/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /rules/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /archive/ {
            proxy_pass http://locations-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notifications/ {
            proxy_pass http://notification-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600;
        }

        location /battles/internal/ {
            return 403;
        }

        location /battles/ {
            proxy_pass http://battle-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # Block internal autobattle endpoints from external access
        location /autobattle/internal/ {
            return 403;
        }

        location /autobattle/ {
            rewrite ^/autobattle(/.*)$ $1 break;
            proxy_pass http://autobattle-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal battle-pass endpoints from external access
        location /battle-pass/internal/ {
            return 403;
        }

        location /battle-pass/ {
            proxy_pass http://battle-pass-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block internal dungeon-service endpoints from external access
        location /dungeons/internal/ {
            return 403;
        }

        location /dungeons/ {
            proxy_pass http://dungeon-service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
        }

        # Block internal party-service endpoints from external access
        location /party/internal/ {
            return 403;
        }

        location /party/ {
            proxy_pass http://party-service_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /var/www/photo-service/media/;
            try_files $uri $uri/ =404;
            autoindex off;
        }

        # Dev tools — Adminer (MySQL GUI)
        location /adminer/ {
            proxy_pass http://adminer:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static frontend (SPA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
