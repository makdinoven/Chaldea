# Production overlay for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before first run, obtain SSL certificate:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot \
#     certonly --webroot -w /var/www/certbot -d fallofgods.top

# Auto-restart policy: containers come back up after a host reboot
# (e.g. VPS restarted by the provider). Merged into every prod service below.
x-restart: &restart
  restart: unless-stopped

services:
  # --- Frontend: not needed in prod (built into api-gateway) ---
  frontend:
    profiles: ["dev"]

  # --- Dev tools: disabled in production ---
  redis-insight:
    profiles: ["dev"]

  mongo-express:
    profiles: ["dev"]

  # Adminer остаётся доступным в prod через api-gateway /adminer/
  # (порт наружу не публикуем, доступ только через Nginx)
  adminer:
    <<: *restart
    ports: !reset []

  # --- API Gateway: production build with SSL ---
  api-gateway:
    <<: *restart
    build:
      context: .
      dockerfile: ./docker/api-gateway/Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on: !override
      user-service:
        condition: service_started
      battle-service:
        condition: service_started
      autobattle-service:
        condition: service_started

  # --- Certbot: SSL certificate management ---
  certbot:
    <<: *restart
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: sh -c "while :; do certbot renew --quiet; sleep 12h; done"

  # --- MySQL: remove exposed port ---
  mysql:
    <<: *restart
    ports: !reset []

  # --- Redis: remove exposed port ---
  redis:
    <<: *restart
    ports: !reset []

  # --- MongoDB: remove exposed port ---
  mongo:
    <<: *restart
    ports: !reset []

  # --- RabbitMQ: remove exposed ports ---
  rabbitmq:
    <<: *restart
    ports: !reset []

  # --- Backend services: no --reload, no volume mounts, no exposed ports ---
  user-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []

  photo-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []

  character-attributes-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8002 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []

  skills-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8003 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}

  inventory-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8004 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []

  character-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8005 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    depends_on:
      mysql:
        condition: service_healthy
      skills-service:
        condition: service_started

  locations-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8006 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      BATTLEPASS_SERVICE_URL: http://battle-pass-service:8012

  battle-pass-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8012 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      CHARACTER_SERVICE_URL: http://character-service:8005
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      USER_SERVICE_URL: http://user-service:8000

  notification-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app uvicorn main:app --host 0.0.0.0 --port 8007 --proxy-headers --forwarded-allow-ips='*'"
    volumes: !reset []
    ports: !reset []
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      AUTH_SERVICE_URL: http://user-service:8000

  battle-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017/${DB_DATABASE}
      CHARACTER_SERVICE_URL: http://character-service:8005
      SKILLS_SERVICE_URL: http://skills-service:8003
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      AUTOBATTLE_SERVICE_URL: http://autobattle-service:8011
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      # FEAT-125 cutover: enable on first deploy, then remove
      # BATTLE_RESET_ON_BOOT: "1"

  autobattle-service:
    <<: *restart
    command: sh -c "PYTHONPATH=/app uvicorn main:app --host 0.0.0.0 --port 8011 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      BATTLE_SERVICE_URL: http://battle-service:8010
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017/${DB_DATABASE}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}

  dungeon-service:
    <<: *restart
    command: sh -c "cd /app && PYTHONPATH=/app alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8013 --proxy-headers --forwarded-allow-ips='*' --app-dir /app"
    volumes: !reset []
    ports: !reset []
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://fallofgods.top}
      CHARACTER_SERVICE_URL: http://character-service:8005
      BATTLE_SERVICE_URL: http://battle-service:8010
      CHAR_ATTRS_SERVICE_URL: http://character-attributes-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      USER_SERVICE_URL: http://user-service:8000

  # --- Celery: no watchfiles wrapper ---
  celery-worker:
    <<: *restart
    command: celery -A tasks:celery_app worker --loglevel=info
    volumes: !reset []
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      MONGO_URI: mongodb://mongo:27017
      BATTLE_SERVICE_URL: http://battle-service:8010
      SKILLS_SERVICE_URL: http://skills-service:8003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}

  celery-beat:
    <<: *restart
    command: celery -A tasks:celery_app beat --loglevel=info
    volumes: !reset []

volumes:
  certbot-webroot:
  certbot-certs:
